<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cashback Cricket</title>
<style>
  :root{
    --ramp-green:#16a34a;
    --ramp-dark:#0b3b2e;
    --cash:#f6c945;
    --cream:#fff8df;
    --red:#ef4444;
  }
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(circle at 20% 10%, rgba(246,201,69,.28), transparent 26%),
      linear-gradient(135deg,#052e25 0%,#0f5b3c 48%,#84cc16 130%);
    font-family:"Trebuchet MS", system-ui, -apple-system, Segoe UI, sans-serif;
    overflow:hidden;
    color:#fff;
  }
  #wrap{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    box-sizing:border-box;
  }
  canvas{
    width:min(96vw, 820px);
    height:auto;
    background:linear-gradient(#8ddd63,#45a83b);
    box-shadow:0 18px 60px rgba(0,0,0,.42), inset 0 0 0 2px rgba(255,255,255,.2);
    border-radius:18px;
    cursor:pointer;
    touch-action:manipulation;
  }
  #hud{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    width:min(96vw, 820px);
    color:#fff;
    pointer-events:none;
    text-shadow:0 2px 4px rgba(0,0,0,.38);
    display:flex;
    flex-direction:column;
    gap:4px;
    align-items:center;
    z-index:2;
  }
  #hud .title{
    font-size:24px;
    font-weight:900;
    letter-spacing:.2px;
  }
  #hud .stats{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    font-size:17px;
    font-weight:800;
    background:rgba(7,55,42,.62);
    border:1px solid rgba(255,255,255,.22);
    border-radius:999px;
    padding:8px 14px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    backdrop-filter:blur(4px);
  }
  #hud .hint{
    font-size:13px;
    font-weight:800;
    color:#fff8df;
    opacity:.95;
  }
  #msg{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(5,20,18,.72);
    color:#fff;
    text-align:center;
    padding:24px;
    box-sizing:border-box;
    z-index:5;
    backdrop-filter:blur(5px);
  }
  #msg .panel{
    max-width:720px;
    border-radius:26px;
    padding:30px 32px 28px;
    background:linear-gradient(180deg,rgba(13,91,63,.96),rgba(8,48,39,.96));
    border:1px solid rgba(255,255,255,.24);
    box-shadow:0 24px 80px rgba(0,0,0,.45);
  }
  #msg h1{
    font-size:46px;
    line-height:1.02;
    margin:.05em 0 .25em;
    color:#fff8df;
    text-shadow:0 3px 0 rgba(0,0,0,.18);
  }
  #msg p{
    font-size:20px;
    line-height:1.42;
    max-width:660px;
    margin:0 auto;
    color:#f2fff4;
  }
  #msg .small{
    margin-top:12px;
    font-size:15px;
    color:rgba(255,255,255,.82);
  }
  button{
    margin-top:20px;
    padding:13px 30px;
    font-size:18px;
    font-weight:900;
    border:none;
    border-radius:999px;
    background:linear-gradient(180deg,#f8d34b,#e8a800);
    color:#17351f;
    cursor:pointer;
    box-shadow:0 8px 0 #9b6e00, 0 16px 30px rgba(0,0,0,.28);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:hover{ transform:translateY(-1px); }
  button:active{ transform:translateY(5px); box-shadow:0 3px 0 #9b6e00, 0 8px 18px rgba(0,0,0,.25); }
  @media (max-width:620px){
    #hud .title{font-size:19px}
    #hud .stats{font-size:13px; gap:8px; padding:7px 10px}
    #hud .hint{font-size:11px}
    #msg h1{font-size:34px}
    #msg p{font-size:17px}
    #msg .panel{padding:24px 18px}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="820" height="540" aria-label="Cashback Cricket game canvas"></canvas></div>

<div id="hud">
  <div class="title" id="hudTitle">Cashback Cricket</div>
  <div class="stats" id="hudStats"></div>
  <div class="hint" id="hudHint">SPACE / CLICK when the invoice reaches the due-date window</div>
</div>

<div id="msg">
  <div class="panel">
    <h1 id="msgTitle"></h1>
    <p id="msgBody"></p>
    <p class="small" id="msgSmall"></p>
    <button onclick="restart()">Play again</button>
  </div>
</div>

<script>
window.GAME_DESIGN = {"chosen_archetype": "cricket", "why": "A timing-based batting game best dramatizes paying each card-eligible invoice exactly on its due date to capture cashback without paying early or missing the window.", "title": "Cashback Cricket", "subtitle": "Swing on the due date and send every eligible bill for cashback.", "hud_label": "Cashback", "duration_seconds": 60, "target_score": 1500, "closing_stat": "You captured {score} cashback points by paying right on time.", "feature_explainer": {"headline": "Ramp Automated Cashback / Card-Eligible Bill Pay", "bullets": ["Ramp automatically pays card-eligible invoices with the Ramp card right on their due date.", "Every eligible bill earns cashback instead of leaving money on the table.", "The goal is to pay inside the cashback window without paying early and wasting float.", "Miss the window and you lose the cashback."], "cta_text": "See Automated Cashback", "learn_more_url": "https://ramp.com"}, "art_style": "clean flat cartoon cricket doodle with bright office greens, bold outlines, simple invoice-and-card characters, and playful cashback accents", "player": {"name": "Ramp Card Batter", "sprite": "player"}, "good_items": [{"name": "Due-Date Invoice Pitch", "sprite": "good_1", "points": 100}, {"name": "Perfect Cashback Window", "sprite": "good_2", "points": 250}], "bad_items": [{"name": "Too-Early Payment", "sprite": "bad_1"}, {"name": "Missed Due Date", "sprite": "bad_2"}], "sprites": [{"name": "player", "role": "player", "prompt": "Ramp card batter holding a payment bat"}, {"name": "good_1", "role": "good", "prompt": "invoice ball with due date label"}, {"name": "good_2", "role": "good", "prompt": "glowing cashback window over a calendar date"}, {"name": "bad_1", "role": "bad", "prompt": "early payment clock with leaking coins"}, {"name": "bad_2", "role": "bad", "prompt": "past due invoice with broken cashback coin"}, {"name": "background", "role": "bg", "prompt": "office cricket pitch with calendar scoreboard and invoice stacks"}]};
window.SPRITE_MANIFEST = {"sprites": {"player": "player.png", "good_1": "good_1.png", "good_2": "good_2.png", "bad_1": "bad_1.png", "bad_2": "bad_2.png", "background": "background.png"}};

(function(){
  function build(fe){
    var wrap=document.createElement('div');
    wrap.id='ramp-feature-card';
    wrap.style.cssText='margin:16px auto 4px;padding:16px 20px;max-width:560px;text-align:left;'+
      'background:#ffffff;color:#111;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:15px;line-height:1.5;';
    var h='<div style="font-size:18px;font-weight:800;margin-bottom:8px;color:#1a7f37">'+
      (fe.headline||'About this Ramp launch')+'</div>';
    if(fe.bullets&&fe.bullets.length){ h+='<ul style="margin:0 0 10px 18px;padding:0">';
      fe.bullets.forEach(function(b){ h+='<li style="margin:3px 0">'+b+'</li>'; }); h+='</ul>'; }
    if(fe.learn_more_url){ h+='<a href="'+fe.learn_more_url+'" target="_blank" rel="noopener" '+
      'style="display:inline-block;margin-top:4px;padding:8px 16px;background:#1a7f37;color:#fff;'+
      'border-radius:20px;text-decoration:none;font-weight:700">'+(fe.cta_text||'Learn more')+' →</a>'; }
    wrap.innerHTML=h; return wrap;
  }
  function inject(){
    var fe=(window.GAME_DESIGN||{}).feature_explainer; if(!fe) return;
    var m=document.getElementById('msg'); if(!m) return;
    var visible=getComputedStyle(m).display!=='none';
    if(visible && !document.getElementById('ramp-feature-card')){
      var btn=m.querySelector('button'); var card=build(fe);
      if(btn) m.insertBefore(card,btn); else m.appendChild(card);
    }
  }
  function start(){
    var m=document.getElementById('msg');
    if(m){ new MutationObserver(inject).observe(m,{attributes:true,attributeFilter:['style','class']}); }
    // Fallback poll in case the overlay is toggled by other means.
    setInterval(inject,600);
  }
  if(document.readyState!=='loading') start(); else document.addEventListener('DOMContentLoaded',start);
})();

</script>

<script>
(() => {
  // ARCHETYPE: Cricket — timing. A pitch approaches the strike zone; press SPACE/click at the
  // right moment. Perfect timing = big score. Theme: due-date bill pay cashback.
  const DEFAULT_DESIGN = {
    title:"Cashback Cricket",
    subtitle:"Swing on the due date and send every eligible bill for cashback.",
    hud_label:"Cashback",
    duration_seconds:60,
    target_score:1500,
    closing_stat:"You captured {score} cashback points by paying right on time.",
    player:{name:"Ramp Card Batter",sprite:"player"},
    good_items:[
      {name:"Due-Date Invoice Pitch",sprite:"good_1",points:100},
      {name:"Perfect Cashback Window",sprite:"good_2",points:250}
    ],
    bad_items:[
      {name:"Too-Early Payment",sprite:"bad_1"},
      {name:"Missed Due Date",sprite:"bad_2"}
    ],
    sprites:[{name:"background",role:"bg"}]
  };

  const injected = window.GAME_DESIGN || {};
  const D = Object.assign({}, DEFAULT_DESIGN, injected);
  D.player = Object.assign({}, DEFAULT_DESIGN.player, injected.player || {});
  D.good_items = (injected.good_items && injected.good_items.length ? injected.good_items : DEFAULT_DESIGN.good_items);
  D.bad_items = (injected.bad_items && injected.bad_items.length ? injected.bad_items : DEFAULT_DESIGN.bad_items);
  D.sprites = (injected.sprites && injected.sprites.length ? injected.sprites : DEFAULT_DESIGN.sprites);

  const manifest = (window.SPRITE_MANIFEST && window.SPRITE_MANIFEST.sprites) || {};
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  const hudTitle = document.getElementById("hudTitle");
  const hudStats = document.getElementById("hudStats");
  const hudHint = document.getElementById("hudHint");

  document.title = D.title || "Cashback Cricket";
  hudTitle.textContent = D.title || "Cashback Cricket";
  hudHint.textContent = "SPACE / CLICK to pay exactly in the glowing due-date window";

  const W = cv.width, H = cv.height;
  const TARGET = Number(D.target_score || 1500);
  const DURATION = Number(D.duration_seconds || 60);
  const MAX_MISS = 5;
  const ZONE = W - 205;
  const BATTER_X = ZONE + 91;
  const BATTER_Y = H/2 + 77;

  const bgEntry = (D.sprites || []).find(s => s.role === "bg" || s.name === "background");
  const BG_NAME = (bgEntry && bgEntry.name) || "background";

  const requestedSpriteNames = new Set(Object.keys(manifest));
  requestedSpriteNames.add((D.player && D.player.sprite) || "player");
  requestedSpriteNames.add(BG_NAME);
  (D.good_items || []).forEach(item => item && item.sprite && requestedSpriteNames.add(item.sprite));
  (D.bad_items || []).forEach(item => item && item.sprite && requestedSpriteNames.add(item.sprite));

  const sprites = {};
  requestedSpriteNames.forEach(name => {
    const img = new Image();
    img.decoding = "async";
    img.onload = () => { img.ok = true; };
    img.onerror = () => { img.failed = true; };
    img.src = "sprites/" + (manifest[name] || (name + ".png"));
    sprites[name] = img;
  });

  function spr(name){
    const img = sprites[name];
    return (img && img.ok && img.complete && img.naturalWidth > 0) ? img : null;
  }

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  let score, misses, timeLeft, running, last, pitch, pitchCount, pendingTimer;
  let swingT, shake, flashText, flashColor, flashT;
  let particles, floaters, recentBadIcon;

  function reset(){
    clearTimeout(pendingTimer);
    score = 0;
    misses = 0;
    timeLeft = DURATION;
    running = true;
    last = performance.now();
    pitch = null;
    pitchCount = 0;
    swingT = 0;
    shake = 0;
    flashText = "";
    flashColor = "#fff";
    flashT = 0;
    particles = [];
    floaters = [];
    recentBadIcon = null;
    newPitch();
  }

  function chooseItem(){
    const goods = D.good_items || DEFAULT_DESIGN.good_items;
    if (goods.length > 1 && pitchCount > 0 && pitchCount % 5 === 0) return goods[1];
    if (goods.length > 1 && Math.random() < 0.14) return goods[1];
    return goods[0] || DEFAULT_DESIGN.good_items[0];
  }

  function newPitch(){
    if(!running) return;
    pitchCount++;
    const item = chooseItem();
    const laneOffset = (Math.random() - .5) * 28;
    const progress = clamp(score / Math.max(1, TARGET), 0, 1);
    pitch = {
      x: 92,
      y: H/2 + 68 + laneOffset,
      sprite: item.sprite || "good_1",
      name: item.name || "Due-Date Invoice Pitch",
      points: Number(item.points || 100),
      speed: 248 + progress * 34 + Math.min(22, pitchCount * 1.1),
      hit:false,
      vx:0,
      vy:0,
      spin:0,
      size: item.sprite === ((D.good_items[1] || {}).sprite) ? 50 : 42
    };
  }

  function scheduleNext(ms){
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => {
      if(running) newPitch();
    }, ms);
  }

  function flash(text, color){
    flashText = text;
    flashColor = color;
    flashT = .85;
  }

  function addFloater(text, x, y, color){
    floaters.push({text,x,y,vy:-44,life:1.05,color});
  }

  function burst(x,y,color,count=18, cash=false){
    for(let i=0;i<count;i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 55 + Math.random()*180;
      particles.push({
        x,y,
        vx:Math.cos(a)*sp,
        vy:Math.sin(a)*sp - (cash?45:0),
        life:.55 + Math.random()*.55,
        max:1,
        size:3 + Math.random()*6,
        color,
        cash
      });
    }
  }

  function showBad(spriteName, x, y){
    recentBadIcon = {sprite:spriteName, x, y, life:.75};
  }

  function swing(){
    if(!running) return;

    swingT = .22;

    if(!pitch){
      const bad = (D.bad_items && D.bad_items[0]) || DEFAULT_DESIGN.bad_items[0];
      misses++;
      flash("Too early — wasted float", "#ff6b6b");
      addFloater("No invoice in the window", ZONE, H/2 + 28, "#ffb4b4");
      showBad(bad.sprite || "bad_1", ZONE, H/2 + 80);
      shake = Math.max(shake, 8);
      if(misses >= MAX_MISS) return end(false, "Too many payments missed the cashback window.");
      return;
    }

    if(pitch.hit) return;

    const d = Math.abs(pitch.x - ZONE);
    let gained = 0;
    let quality = "";

    if(d < 24){
      gained = pitch.points;
      quality = "Perfect due date";
      score += gained;
      pitch.hit = true;
      pitch.vx = 420;
      pitch.vy = -220;
      flash("PERFECT DUE DATE! +" + gained, "#f6c945");
      addFloater("+" + gained + " cashback", ZONE, pitch.y - 24, "#fff3a6");
      burst(ZONE, pitch.y, "#f6c945", 28, true);
      shake = Math.max(shake, 4);
    } else if(d < 62){
      gained = Math.max(50, Math.round(pitch.points * .6));
      quality = "In the cashback window";
      score += gained;
      pitch.hit = true;
      pitch.vx = 330;
      pitch.vy = -145;
      flash("IN WINDOW +" + gained, "#8cff9c");
      addFloater("+" + gained + " cashback", ZONE, pitch.y - 22, "#b9ffc2");
      burst(ZONE, pitch.y, "#70f28a", 18, true);
      shake = Math.max(shake, 2);
    } else {
      const early = pitch.x < ZONE;
      const bad = early
        ? ((D.bad_items && D.bad_items[0]) || DEFAULT_DESIGN.bad_items[0])
        : ((D.bad_items && D.bad_items[1]) || DEFAULT_DESIGN.bad_items[1]);
      misses++;
      pitch.hit = true;
      pitch.vx = early ? -90 : 90;
      pitch.vy = 120;
      flash(early ? "Too early — no cashback" : "Late swing — window missed", "#ff6b6b");
      addFloater(early ? "Too-early payment" : "Missed due date", pitch.x, pitch.y - 22, "#ffc1c1");
      showBad(bad.sprite || (early ? "bad_1" : "bad_2"), pitch.x, pitch.y);
      burst(pitch.x, pitch.y, "#ef4444", 16, false);
      shake = Math.max(shake, 9);
      if(misses >= MAX_MISS) {
        scheduleNext(500);
        return setTimeout(() => end(false, "Too many invoices slipped outside the cashback window."), 420);
      }
    }

    if(score >= TARGET){
      return setTimeout(() => end(true, quality), 520);
    }

    scheduleNext(gained ? 980 : 850);
  }

  addEventListener("keydown", e => {
    if(e.code === "Space"){
      e.preventDefault();
      swing();
    }
  });
  cv.addEventListener("click", swing);
  cv.addEventListener("touchstart", e => {
    e.preventDefault();
    swing();
  }, {passive:false});

  function update(dt){
    if(!running) return;

    timeLeft -= dt;
    if(timeLeft <= 0){
      timeLeft = 0;
      return end(score >= TARGET, "The 60-second bill run is over.");
    }

    if(swingT > 0) swingT -= dt;
    if(shake > 0) shake = Math.max(0, shake - dt * 24);
    if(flashT > 0) flashT -= dt;

    if(recentBadIcon){
      recentBadIcon.life -= dt;
      recentBadIcon.y -= dt * 18;
      if(recentBadIcon.life <= 0) recentBadIcon = null;
    }

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.life -= dt;
      p.vy += 210 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if(p.life <= 0) particles.splice(i,1);
    }

    for(let i=floaters.length-1;i>=0;i--){
      const f = floaters[i];
      f.life -= dt;
      f.y += f.vy * dt;
      if(f.life <= 0) floaters.splice(i,1);
    }

    if(pitch){
      if(pitch.hit){
        pitch.x += pitch.vx * dt;
        pitch.y += pitch.vy * dt;
        pitch.vy += 420 * dt;
        pitch.spin += dt * 9;
        if(pitch.x > W + 90 || pitch.y > H + 90 || pitch.x < -90) pitch = null;
      } else {
        pitch.x += pitch.speed * dt;
        pitch.spin += dt * 5;
        if(pitch.x > W - 28){
          const bad = (D.bad_items && D.bad_items[1]) || DEFAULT_DESIGN.bad_items[1];
          misses++;
          flash("Let it through — past due", "#ff6b6b");
          addFloater("Missed due date", ZONE + 20, pitch.y - 30, "#ffc1c1");
          showBad(bad.sprite || "bad_2", ZONE + 38, pitch.y);
          burst(ZONE + 20, pitch.y, "#ef4444", 18, false);
          shake = Math.max(shake, 10);
          pitch.hit = true;
          pitch.vx = 160;
          pitch.vy = 130;
          if(misses >= MAX_MISS) {
            return setTimeout(() => end(false, "Too many invoices passed the due-date window."), 360);
          }
          scheduleNext(780);
        }
      }
    }
  }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function drawSprite(name,x,y,w,h, fallback){
    const img = spr(name);
    if(img){
      ctx.drawImage(img, x - w/2, y - h/2, w, h);
    } else if(fallback) {
      fallback(x,y,w,h);
    }
  }

  function fallbackPlayer(x,y,w,h){
    ctx.save();
    ctx.translate(x,y);
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#12352b";
    ctx.fillStyle = "#0b5";
    roundedRect(-w*.28,-h*.25,w*.56,h*.52,12);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#fff8df";
    ctx.beginPath(); ctx.arc(0,-h*.45,w*.17,0,Math.PI*2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#243c5a";
    roundedRect(-w*.22,-h*.05,w*.44,h*.22,8);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#f6c945";
    ctx.font = "900 13px Trebuchet MS";
    ctx.textAlign = "center";
    ctx.fillText("RAMP", 0, h*.03);
    ctx.restore();
  }

  function fallbackInvoiceBall(x,y,w,h){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate((pitch && pitch.spin) || 0);
    ctx.fillStyle = "#fffdf2";
    ctx.strokeStyle = "#143b2d";
    ctx.lineWidth = 3;
    roundedRect(-w*.45,-h*.42,w*.9,h*.84,8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#16a34a";
    ctx.fillRect(-w*.28,-h*.18,w*.56,4);
    ctx.fillRect(-w*.28,-h*.02,w*.46,4);
    ctx.fillStyle = "#f6c945";
    ctx.beginPath(); ctx.arc(w*.22,h*.2,w*.14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#12352b";
    ctx.font = "900 9px Trebuchet MS";
    ctx.textAlign = "center";
    ctx.fillText("DUE", 0, -h*.26);
    ctx.restore();
  }

  function fallbackCashWindow(x,y,w,h){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate((pitch && pitch.spin) || 0);
    ctx.fillStyle = "#fff8df";
    ctx.strokeStyle = "#143b2d";
    ctx.lineWidth = 3;
    roundedRect(-w*.45,-h*.42,w*.9,h*.84,10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#16a34a";
    ctx.fillRect(-w*.45,-h*.42,w*.9,h*.22);
    ctx.fillStyle = "#f6c945";
    ctx.beginPath(); ctx.arc(0,h*.12,w*.22,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#143b2d";
    ctx.font = "900 16px Trebuchet MS";
    ctx.textAlign = "center";
    ctx.fillText("$",0,h*.18);
    ctx.restore();
  }

  function fallbackBad(x,y,w,h,label){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = "#fee2e2";
    ctx.strokeStyle = "#7f1d1d";
    ctx.lineWidth = 3;
    roundedRect(-w*.43,-h*.36,w*.86,h*.72,10);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-w*.22,-h*.18); ctx.lineTo(w*.22,h*.18);
    ctx.moveTo(w*.22,-h*.18); ctx.lineTo(-w*.22,h*.18);
    ctx.stroke();
    ctx.fillStyle = "#7f1d1d";
    ctx.font = "900 10px Trebuchet MS";
    ctx.textAlign = "center";
    ctx.fillText(label,0,h*.34);
    ctx.restore();
  }

  function drawBackground(){
    const bg = spr(BG_NAME);
    if(bg){
      ctx.drawImage(bg,0,0,W,H);
      ctx.fillStyle = "rgba(9,70,44,.16)";
      ctx.fillRect(0,0,W,H);
      return;
    }

    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#a7f06b");
    g.addColorStop(.45,"#53bd4c");
    g.addColorStop(1,"#168147");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = "rgba(255,255,255,.12)";
    for(let i=0;i<9;i++){
      ctx.beginPath();
      ctx.ellipse(80+i*92, 88+(i%2)*34, 48, 14, -.08, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.fillStyle = "#d6b56d";
    roundedRect(82,H/2+35,626,112,28);
    ctx.fill();
    ctx.strokeStyle = "rgba(74,48,20,.25)";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,.28)";
    for(let x=128;x<690;x+=66){
      ctx.fillRect(x,H/2+87,34,3);
    }

    ctx.fillStyle = "rgba(255,248,223,.92)";
    roundedRect(52,95,178,74,14);
    ctx.fill();
    ctx.strokeStyle = "#174533";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = "#174533";
    ctx.font = "900 15px Trebuchet MS";
    ctx.textAlign = "center";
    ctx.fillText("ELIGIBLE",141,124);
    ctx.fillText("INVOICES",141,148);

    ctx.fillStyle = "rgba(255,248,223,.94)";
    roundedRect(W-216,92,152,86,14);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#16a34a";
    ctx.fillRect(W-216,92,152,26);
    ctx.fillStyle = "#17351f";
    ctx.font = "900 14px Trebuchet MS";
    ctx.fillText("CALENDAR",W-140,112);
    ctx.fillStyle = "#f6c945";
    ctx.beginPath(); ctx.arc(W-140,145,20,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#17351f";
    ctx.font = "900 20px Trebuchet MS";
    ctx.fillText("$",W-140,152);
  }

  function drawStrikeZone(){
    const pulse = .5 + .5 * Math.sin(performance.now() / 170);
    ctx.save();
    ctx.globalAlpha = .96;
    ctx.fillStyle = `rgba(246,201,69,${.16 + pulse*.09})`;
    roundedRect(ZONE-34,H/2+8,68,156,16);
    ctx.fill();

    ctx.strokeStyle = "#fff8df";
    ctx.lineWidth = 4;
    ctx.setLineDash([10,8]);
    roundedRect(ZONE-34,H/2+8,68,156,16);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = "#f6c945";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(ZONE,H/2+10);
    ctx.lineTo(ZONE,H/2+162);
    ctx.stroke();

    ctx.fillStyle = "#17351f";
    roundedRect(ZONE-63,H/2-24,126,28,14);
    ctx.fill();
    ctx.fillStyle = "#fff8df";
    ctx.font = "900 13px Trebuchet MS";
    ctx.textAlign = "center";
    ctx.fillText("DUE DATE",ZONE,H/2-5);
    ctx.restore();
  }

  function drawBat(){
    ctx.save();
    ctx.translate(BATTER_X - 34, BATTER_Y - 8);
    const ang = swingT > 0 ? lerp(-.25, -1.05, swingT/.22) : -.25;
    ctx.rotate(ang);
    ctx.fillStyle = "#f7c77d";
    ctx.strokeStyle = "#12352b";
    ctx.lineWidth = 3;
    roundedRect(-8,-72,16,94,8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#17351f";
    roundedRect(-7,10,14,38,7);
    ctx.fill();
    ctx.restore();
  }

  function drawPitch(){
    if(!pitch) return;
    ctx.save();
    const scale = 1 + Math.sin(performance.now()/100) * .03;
    const w = pitch.size * scale;
    const h = pitch.size * scale;
    const secondSprite = (D.good_items[1] || {}).sprite;
    drawSprite(
      pitch.sprite,
      pitch.x,
      pitch.y,
      w,
      h,
      pitch.sprite === secondSprite ? fallbackCashWindow : fallbackInvoiceBall
    );
    ctx.restore();
  }

  function drawParticles(){
    particles.forEach(p => {
      const a = clamp(p.life / .9, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      if(p.cash){
        ctx.fillStyle = "#f6c945";
        ctx.strokeStyle = "#9b6e00";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#17351f";
        ctx.font = "900 " + Math.max(8,p.size*1.6) + "px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("$",p.x,p.y+.5);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });

    floaters.forEach(f => {
      ctx.save();
      ctx.globalAlpha = clamp(f.life,0,1);
      ctx.fillStyle = f.color;
      ctx.strokeStyle = "rgba(0,0,0,.35)";
      ctx.lineWidth = 5;
      ctx.font = "900 20px Trebuchet MS";
      ctx.textAlign = "center";
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    });

    if(recentBadIcon){
      const s = 58 + (1-recentBadIcon.life) * 18;
      ctx.save();
      ctx.globalAlpha = clamp(recentBadIcon.life/.75,0,1);
      const isEarly = recentBadIcon.sprite === ((D.bad_items[0] || {}).sprite);
      drawSprite(
        recentBadIcon.sprite,
        recentBadIcon.x,
        recentBadIcon.y,
        s,
        s,
        (x,y,w,h) => fallbackBad(x,y,w,h,isEarly ? "EARLY" : "PAST DUE")
      );
      ctx.restore();
    }
  }

  function drawScoreboard(){
    ctx.save();
    ctx.fillStyle = "rgba(7,55,42,.74)";
    roundedRect(274,86,272,54,18);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.lineWidth = 2;
    ctx.stroke();

    const pct = clamp(score / TARGET, 0, 1);
    ctx.fillStyle = "rgba(255,255,255,.18)";
    roundedRect(294,116,232,12,6);
    ctx.fill();
    ctx.fillStyle = "#f6c945";
    roundedRect(294,116,232*pct,12,6);
    ctx.fill();

    ctx.fillStyle = "#fff8df";
    ctx.font = "900 15px Trebuchet MS";
    ctx.textAlign = "center";
    ctx.fillText("Cashback target: " + score + " / " + TARGET, 410, 107);
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    const sx = shake ? (Math.random()-.5)*shake : 0;
    const sy = shake ? (Math.random()-.5)*shake : 0;

    ctx.save();
    ctx.translate(sx,sy);

    drawBackground();

    ctx.fillStyle = "rgba(12,68,42,.23)";
    ctx.beginPath();
    ctx.ellipse(W/2,H/2+96,360,112,0,0,Math.PI*2);
    ctx.fill();

    drawStrikeZone();
    drawScoreboard();

    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,.16)";
    ctx.strokeStyle = "rgba(255,255,255,.38)";
    ctx.lineWidth = 2;
    ctx.setLineDash([8,9]);
    ctx.beginPath();
    ctx.moveTo(100,H/2+68);
    ctx.lineTo(ZONE,H/2+86);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#fff8df";
    ctx.font = "900 12px Trebuchet MS";
    ctx.textAlign = "left";
    ctx.fillText("invoice pitch", 116, H/2+56);
    ctx.restore();

    drawPitch();

    drawBat();
    drawSprite((D.player && D.player.sprite) || "player", BATTER_X, BATTER_Y - 18, 112, 112, fallbackPlayer);

    ctx.fillStyle = "rgba(7,55,42,.72)";
    roundedRect(BATTER_X-78,BATTER_Y+48,156,26,13);
    ctx.fill();
    ctx.fillStyle = "#fff8df";
    ctx.font = "900 12px Trebuchet MS";
    ctx.textAlign = "center";
    ctx.fillText((D.player && D.player.name) || "Ramp Card Batter", BATTER_X, BATTER_Y+66);

    drawParticles();

    if(flashT > 0){
      ctx.save();
      ctx.globalAlpha = clamp(flashT/.85,0,1);
      ctx.fillStyle = flashColor;
      ctx.strokeStyle = "rgba(0,0,0,.38)";
      ctx.lineWidth = 7;
      ctx.font = "900 34px Trebuchet MS";
      ctx.textAlign = "center";
      ctx.strokeText(flashText,W/2,184);
      ctx.fillText(flashText,W/2,184);
      ctx.restore();
    }

    ctx.restore();

    hudStats.innerHTML =
      `<span>${D.hud_label || "Cashback"}: ${score}/${TARGET}</span>` +
      `<span>⏱ ${Math.ceil(timeLeft)}s</span>` +
      `<span>Windows missed: ${misses}/${MAX_MISS}</span>`;
  }

  function loop(now){
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    update(dt);
    draw();
    if(running) requestAnimationFrame(loop);
  }

  function end(won, reason){
    if(!running) return;
    running = false;
    clearTimeout(pendingTimer);

    const stat = (D.closing_stat || "You captured {score} cashback points by paying right on time.")
      .replace(/\{score\}/g, score)
      .replace(/X/g, score);

    document.getElementById("msgTitle").textContent = won ? "Cashback Captured!" : "Window Closed";
    document.getElementById("msgBody").textContent = won
      ? stat
      : `${stat} Target: ${TARGET}. ${reason || "Try again and swing right on the due date."}`;
    document.getElementById("msgSmall").textContent = won
      ? "Every clean hit means another card-eligible invoice paid exactly when cashback counts."
      : "Tip: wait until the invoice overlaps the glowing due-date window, then swing.";
    document.getElementById("msg").style.display = "flex";
  }

  window.restart = function restart(){
    document.getElementById("msg").style.display = "none";
    reset();
    requestAnimationFrame(loop);
  };

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
