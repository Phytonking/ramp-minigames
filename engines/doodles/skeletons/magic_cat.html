<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Cat Skeleton</title>
<style>
  html,body{margin:0;height:100%;background:#1a1030;font-family:'Trebuchet MS',sans-serif;overflow:hidden;}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:radial-gradient(circle at 50% 40%,#3a2260,#160c28);box-shadow:0 8px 40px rgba(0,0,0,.5);border-radius:8px;cursor:crosshair;}
  #hud{position:absolute;top:16px;left:0;right:0;text-align:center;color:#f6c945;font-size:22px;font-weight:bold;pointer-events:none;}
  #msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#fff;text-align:center;padding:24px;}
  #msg h1{font-size:44px;margin:.2em;} #msg p{font-size:20px;max-width:640px;}
  button{margin-top:16px;padding:12px 28px;font-size:18px;border:none;border-radius:30px;background:#8e44ad;color:#fff;cursor:pointer;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="820" height="560"></canvas></div>
<div id="hud"></div>
<div id="msg"><h1 id="msgTitle"></h1><p id="msgBody"></p><button onclick="restart()">Play again</button></div>

<!-- PARAMS_INJECTION_POINT -->

<script>
// ARCHETYPE: Magic Cat Academy — enemies approach the center; click the one matching the
// highlighted target type to zap it. CODEGEN: theme enemy types/labels/sprites to the launch;
// keep the "match the correct response to the incoming threat" mechanic.
const D = window.GAME_DESIGN || {};
const M = (window.SPRITE_MANIFEST && window.SPRITE_MANIFEST.sprites) || {};
const cv=document.getElementById('game'), ctx=cv.getContext('2d'), hud=document.getElementById('hud');
// Each enemy "type" = a threat you clear by matching. Use good_items as the clearable types.
const types = (D.enemy_types && D.enemy_types.length) ? D.enemy_types
            : (D.good_items && D.good_items.length ? D.good_items : [{name:'Ghost',sprite:'enemy'}]);
const DURATION=D.duration_seconds||60, TARGET=D.target_score||1200;
const COLORS=['#e74c3c','#f6c945','#3498db','#2ecc71','#e67e22'];

const sprites={}; for(const k in M){const img=new Image();img.src='sprites/'+M[k];sprites[k]=img;}
function spr(n){const i=sprites[n];return (i&&i.complete&&i.naturalWidth)?i:null;}

const cx=()=>cv.width/2, cy=()=>cv.height/2+20;
let enemies,score,lives,timeLeft,spawnT,target,running,last;
function reset(){ enemies=[]; score=0; lives=3; timeLeft=DURATION; spawnT=0; running=true; last=performance.now(); pickTarget(); }
function pickTarget(){ target=Math.floor(Math.random()*types.length); }
reset();

function spawn(){ const t=Math.floor(Math.random()*types.length); const a=Math.random()*Math.PI*2;
  enemies.push({t,a,r:Math.max(cv.width,cv.height)/2+40}); }

cv.addEventListener('click',e=>{ if(!running) return;
  const mx=e.offsetX,my=e.offsetY;
  for(let i=enemies.length-1;i>=0;i--){ const en=enemies[i];
    const x=cx()+Math.cos(en.a)*en.r, y=cy()+Math.sin(en.a)*en.r;
    if(Math.hypot(mx-x,my-y)<40){
      if(en.t===target){ score+=100; enemies.splice(i,1); pickTarget(); if(score>=TARGET) end(true); }
      else { lives--; if(lives<=0) end(false); }
      return;
    }
  }
});

function update(dt){ if(!running) return;
  timeLeft-=dt; if(timeLeft<=0){ timeLeft=0; end(score>=TARGET); return; }
  spawnT-=dt; if(spawnT<=0){ spawn(); spawnT=Math.max(0.5,1.4-(DURATION-timeLeft)*0.012); }
  const sp=40+(DURATION-timeLeft)*1.1;
  for(const en of enemies){ en.r-=sp*dt; }
  for(let i=enemies.length-1;i>=0;i--){ if(enemies[i].r<=44){ lives--; enemies.splice(i,1); if(lives<=0){end(false);return;} } }
}

function drawAt(x,y,name,fallback,size){ const s=spr(name);
  if(s) ctx.drawImage(s,x-size/2,y-size/2,size,size);
  else{ ctx.fillStyle=fallback; ctx.beginPath(); ctx.arc(x,y,size/2,0,7); ctx.fill(); } }
function draw(){ ctx.clearRect(0,0,cv.width,cv.height);
  const bg=spr('background'); if(bg) ctx.drawImage(bg,0,0,cv.width,cv.height);
  // center wizard/cat
  drawAt(cx(),cy(),(D.player&&D.player.sprite)||'player','#f6c945',86);
  for(const en of enemies){ const x=cx()+Math.cos(en.a)*en.r,y=cy()+Math.sin(en.a)*en.r;
    drawAt(x,y,types[en.t].sprite||('enemy_'+en.t),COLORS[en.t%COLORS.length],54); }
  hud.innerHTML = `${D.hud_label||'Cleared'}: ${score}/${TARGET} &nbsp; ♥${lives} &nbsp; ⏱${Math.ceil(timeLeft)}s <br>`+
    `<span style="font-size:16px">Click the: <b style="color:${COLORS[target%COLORS.length]}">${types[target].name}</b></span>`;
}
function loop(now){ const dt=Math.min((now-last)/1000,.05); last=now; update(dt); draw(); if(running) requestAnimationFrame(loop); }
function end(w){ running=false; document.getElementById('msgTitle').textContent=w?'YOU WIN!':'GAME OVER';
  const stat=(D.closing_stat||'').replace('{score}',score).replace('X',score);
  document.getElementById('msgBody').textContent=(w?stat:'')+`  (Score: ${score})`;
  document.getElementById('msg').style.display='flex'; }
function restart(){ document.getElementById('msg').style.display='none'; reset(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
